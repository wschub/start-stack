# CI del propio CLI (cli/). GitHub solo ejecuta workflows desde la raíz del repositorio, por eso
# este archivo vive aquí y trabaja dentro de cli/. El CLI usa las maquetas como plantillas, así que
# cualquier cambio en ellas también lo dispara (la prueba de oro las compara con lo que genera).
name: cli CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "create-start-stack/**"
      - "hex-mockup/**"
      - "ddd-mockup/**"
      - "clean-mockup/**"
      - ".github/workflows/cli-ci.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "create-start-stack/**"
      - "hex-mockup/**"
      - "ddd-mockup/**"
      - "clean-mockup/**"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli

jobs:
  quality:
    name: Calidad y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (genera las 3 arquitecturas y ejecuta su verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # El CLI hace el primer commit del proyecto generado: el runner no tiene identidad de git.
      GIT_AUTHOR_NAME: start-stack CI
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: start-stack CI
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      # ubuntu-latest trae Docker: Testcontainers levanta Postgres para las pruebas de integración.
      - run: npm run test:e2e
