services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hex
      POSTGRES_PASSWORD: hex
      POSTGRES_DB: hex_mockup
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hex -d hex_mockup"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
